
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Qual o seu Time do Coração?</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: white;
        }

        .imagem-exercicio {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        h1 {
            font-family: "Times New Roman", serif;
            font-size: 36px;
        }

        select, button {
            font-size: 18px;
            margin-right: 5px;
        }

        #resultado {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Imagem do exercício -->
    <img
        class="imagem-exercicio"
        src=""
        alt="Imagem original do exercício sobre o time do coração"
        width="590"
    >

    <h1>Qual o seu Time do Coração?</h1>

    <form id="formTime">
        <select id="time" name="time">
            <option value="Botafogo">Botafogo</option>
            <option value="Flamengo">Flamengo</option>
            <option value="Fluminense">Fluminense</option>
            <option value="Vasco da Gama">Vasco da Gama</option>
        </select>

        <button type="submit">Enviar</button>
        <button type="button" id="cancelar">Cancelar</button>
    </form>

    <p id="resultado"></p>

    <script>
        const formulario = document.getElementById("formTime");
        const time = document.getElementById("time");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            resultado.textContent =
                "Seu time do coração é: " + time.value + "!";
        });

        document.getElementById("cancelar")
            .addEventListener("click", function() {
                time.selectedIndex = 0;
                resultado.textContent = "";
            });
    </script>

</body>
</html>
