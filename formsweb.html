
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h2, h3 {
            color: #333;
        }

        .container {
            background-color: white;
            padding: 20px;
            max-width: 400px;
            border-radius: 8px;
        }

        input, select, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0;
            padding: 10px;
        }

        #listBoxClientes {
            height: 120px;
        }

        button {
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        #btnBuscar {
            background-color: #007bff;
        }

        #btnIncluir {
            background-color: #28a745;
        }

        #btnAlterar {
            background-color: #fd7e14;
        }

        button:hover {
            opacity: 0.85;
        }

        #mensagem {
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Cadastro de Clientes</h2>

    <label for="listBoxClientes">Clientes cadastrados:</label>
    <select id="listBoxClientes" size="5"></select>

    <button type="button" id="btnBuscar" onclick="buscarCliente()">
        Buscar Cliente
    </button>

    <h3>Dados do Cliente</h3>

    <form id="formCliente" onsubmit="return false;">
        <input
            type="text"
            id="txtNome"
            placeholder="Nome"
            required
        >

        <input
            type="text"
            id="txtEndereco"
            placeholder="Endereço"
            required
        >

        <input
            type="tel"
            id="txtTelefone"
            placeholder="Telefone"
            required
        >

        <input
            type="email"
            id="txtEmail"
            placeholder="E-mail"
            required
        >

        <button
            type="button"
            id="btnIncluir"
            onclick="incluirCliente()"
        >
            Incluir Cliente
        </button>

        <button
            type="button"
            id="btnAlterar"
            onclick="alterarCliente()"
        >
            Alterar Cliente
        </button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>

</div>

<script>
    // Recupera os clientes salvos no navegador.
    // Os dados de exemplo são criados somente na primeira execução.
    let clientes = JSON.parse(localStorage.getItem("clientes"));

    if (!Array.isArray(clientes)) {
        clientes = [
            {
                id: 1,
                nome: "João Silva",
                endereco: "Rua A",
                telefone: "123456",
                email: "joao@gmail.com"
            },
            {
                id: 2,
                nome: "Maria Oliveira",
                endereco: "Rua B",
                telefone: "654321",
                email: "maria@gmail.com"
            }
        ];

        salvarLocalStorage();
    }

    const listBox = document.getElementById("listBoxClientes");

    // Salva a lista de clientes no localStorage.
    function salvarLocalStorage() {
        localStorage.setItem("clientes", JSON.stringify(clientes));
    }

    // Atualiza a lista exibida na tela.
    function atualizarLista(idSelecionado = null) {
        listBox.innerHTML = "";

        clientes.forEach(cliente => {
            const option = document.createElement("option");

            option.value = cliente.id;
            option.textContent =
                `${cliente.id} - ${cliente.nome}`;

            listBox.appendChild(option);
        });

        // Mantém selecionado o cliente informado.
        if (idSelecionado !== null) {
            listBox.value = String(idSelecionado);
        }
    }

    // Obtém e valida os dados digitados.
    function obterDadosFormulario() {
        const nome = document.getElementById("txtNome").value.trim();
        const endereco = document.getElementById("txtEndereco").value.trim();
        const telefone = document.getElementById("txtTelefone").value.trim();
        const email = document.getElementById("txtEmail").value.trim();

        if (!nome || !endereco || !telefone || !email) {
            mostrarMensagem("Preencha todos os campos.", "red");
            return null;
        }

        // Valida também o formato do e-mail.
        const campoEmail = document.getElementById("txtEmail");

        if (!campoEmail.checkValidity()) {
            mostrarMensagem("Digite um e-mail válido.", "red");
            campoEmail.focus();
            return null;
        }

        return { nome, endereco, telefone, email };
    }

    // Exibe mensagens de sucesso ou erro.
    function mostrarMensagem(texto, cor) {
        const mensagem = document.getElementById("mensagem");
        mensagem.textContent = texto;
        mensagem.style.color = cor;
    }

    // Busca o cliente selecionado e preenche os campos.
    function buscarCliente() {
        if (!listBox.value) {
            mostrarMensagem("Selecione um cliente na lista.", "red");
            return;
        }

        const id = Number(listBox.value);
        const cliente = clientes.find(c => c.id === id);

        if (!cliente) {
            mostrarMensagem("Cliente não encontrado.", "red");
            return;
        }

        document.getElementById("txtNome").value = cliente.nome;
        document.getElementById("txtEndereco").value = cliente.endereco;
        document.getElementById("txtTelefone").value = cliente.telefone;
        document.getElementById("txtEmail").value = cliente.email;

        mostrarMensagem("Dados do cliente carregados.", "green");
    }

    // Inclui um novo cliente com identificador único.
    function incluirCliente() {
        const dados = obterDadosFormulario();

        if (!dados) {
            return;
        }

        // Usa o maior ID existente mais um.
        const maiorId = clientes.reduce(
            (maior, cliente) => Math.max(maior, cliente.id),
            0
        );

        const novoCliente = {
            id: maiorId + 1,
            ...dados
        };

        clientes.push(novoCliente);

        salvarLocalStorage();
        atualizarLista(novoCliente.id);
        limparFormulario();

        mostrarMensagem("Cliente incluído com sucesso!", "green");
    }

    // Altera os dados do cliente selecionado.
    function alterarCliente() {
        if (!listBox.value) {
            mostrarMensagem(
                "Selecione um cliente para alterar.",
                "red"
            );
            return;
        }

        const dados = obterDadosFormulario();

        if (!dados) {
            return;
        }

        const id = Number(listBox.value);
        const indice = clientes.findIndex(c => c.id === id);

        if (indice === -1) {
            mostrarMensagem("Cliente não encontrado.", "red");
            return;
        }

        clientes[indice] = {
            ...clientes[indice],
            ...dados
        };

        salvarLocalStorage();
        atualizarLista(id);

        mostrarMensagem("Cliente alterado com sucesso!", "green");
    }

    // Limpa os campos do formulário.
    function limparFormulario() {
        document.getElementById("formCliente").reset();
    }

    // Carrega a lista ao abrir a página.
    atualizarLista();
</script>

</body>
</html>
